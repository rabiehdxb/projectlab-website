/* Theme: saved choice, else the device setting. Runs before paint to avoid a flash. */
(function(){var d=document.documentElement,K='ple-theme',saved=null;
 try{saved=localStorage.getItem(K)}catch(e){}
 var mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
 function apply(light){if(light)d.setAttribute('data-light','');else d.removeAttribute('data-light')}
 apply(saved?saved==='light':!!(mq&&mq.matches));
 if(mq&&!saved&&mq.addEventListener)mq.addEventListener('change',function(e){try{if(localStorage.getItem(K))return}catch(x){}apply(e.matches);sync()});
 function sync(){var b=document.getElementById('themeBtn');var l=d.hasAttribute('data-light'),ar=d.lang==='ar';
  var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',l?'#F5F2EC':'#0A1C1E');
  if(!b)return;b.setAttribute('aria-pressed',l?'true':'false');
  var lab=l?(ar?'التبديل إلى الوضع الداكن':'Switch to dark mode'):(ar?'التبديل إلى الوضع الفاتح':'Switch to light mode');b.setAttribute('aria-label',lab);[...]
  document.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('themeBtn');sync();
   if(b)b.addEventListener('click',function(){apply(!d.hasAttribute('data-light'));try{localStorage.setItem(K,d.hasAttribute('data-light')?'light':'dark')}catch(e){}sync()});
   if(window.MutationObserver)new MutationObserver(sync).observe(d,{attributes:true,attributeFilter:['lang']})});
 })();
</script>
